name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller pywebview

      - name: Bundle ffprobe
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          New-Item -ItemType Directory -Force packaging/bin | Out-Null
          Get-ChildItem ffmpeg -Recurse -Include ffprobe.exe,ffmpeg.exe | ForEach-Object { Copy-Item $_.FullName packaging/bin/ }
          Get-ChildItem packaging/bin

      - name: Unit tests
        working-directory: backend
        run: python -m tests.test_unit

      - name: Build CamTrack.exe (PyInstaller)
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/camtrack.spec --noconfirm

      - name: Smoke test the built exe (render clip, analyze, export)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\packaging\bin;$env:PATH"
          cd backend
          python -c "from tests.synth import generate; generate('orbit', '../smoke', n=40)"
          cd ..
          $env:CAMTRACK_DATA = "$PWD\smoke_data"
          $p = Start-Process -FilePath dist\CamTrack\CamTrack.exe -ArgumentList "--browser","--port","8123" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8123/api/health | ConvertTo-Json; $ok = $true; break } catch { Start-Sleep 2 }
          }
          if (-not $ok) { Get-Content smoke_data\camtrack.log -ErrorAction SilentlyContinue; throw "app did not start" }
          python backend/tests/e2e_api.py smoke/orbit.mp4 --gt smoke/orbit.gt.json --server http://127.0.0.1:8123
          $code = $LASTEXITCODE
          Stop-Process -Id $p.Id -Force
          if ($code -ne 0) { Get-Content smoke_data\camtrack.log -ErrorAction SilentlyContinue; exit $code }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-dev" }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") { $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          }
          iscc /DAppVersion=$ver packaging/installer.iss
          Compress-Archive -Path dist\CamTrack -DestinationPath "release\CamTrack-$ver-win64-portable.zip"
          Get-ChildItem release

      - uses: actions/upload-artifact@v4
        with:
          name: CamTrack-windows
          path: release/*
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Download
            * **CamTrack-Setup-…-win64.exe** — installer (Start menu + optional desktop shortcut). Recommended.
            * **CamTrack-…-win64-portable.zip** — no install: unzip and run `CamTrack\CamTrack.exe`.

            Windows 10/11 64-bit. The app opens in its own window (Microsoft Edge WebView2, preinstalled on Windows 10/11).
            Project data is stored in `%LOCALAPPDATA%\CamTrack`. The installer is not code-signed, so Windows SmartScreen
            may warn on first launch: choose *More info → Run anyway*.
